# ========== General Settings ==========
set-option -g default-terminal "tmux-256color"
set-option -as terminal-overrides ',*:Tc'
set-option -g base-index 0
set-window-option -g pane-base-index 0
set-option -g mouse on
set-window-option -g mode-keys vi
set-option -s escape-time 50

# ========== Keybindings ==========
# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Create new window with 2 panes
bind-key c new-window \; split-window -h \; select-layout tiled

# Split windows
bind-key | split-window -h
bind-key - split-window -v

# Tile panes
bind-key t select-layout tiled
bind-key e select-layout even-horizontal
bind-key v select-layout even-vertical

# Resize panes
bind-key -n M-Left resize-pane -L 5
bind-key -n M-Right resize-pane -R 5
bind-key -n M-Up resize-pane -U 5
bind-key -n M-Down resize-pane -D 5

# Quickly switch to sessions named 1–9

bind-key 1 switch-client -t 1
bind-key 2 switch-client -t 2
bind-key 3 switch-client -t 3
bind-key 4 switch-client -t 4
bind-key 5 switch-client -t 5
bind-key 6 switch-client -t 6
bind-key 7 switch-client -t 7
bind-key 8 switch-client -t 8
bind-key 9 switch-client -t 9

# Copy mode bindings (for copy/paste)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Paste with prefix + p
bind-key p paste-buffer

# ========== Status Bar ==========
set-option -g status-left-length 30
set-option -g status-right-length 100
set-option -g status-interval 5

# ========== TPM + Plugins ==========
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-sensible'
set-option -g @plugin 'janoamaral/tokyo-night-tmux'

set-option -g @tokyo-night-tmux_theme storm
set-option -g @tokyo-night-tmux_transparent 1
set-option -g @tokyo-night-tmux_window_id_style digital
set-option -g @tokyo-night-tmux_pane_id_style hsquare
set-option -g @tokyo-night-tmux_zoom_id_style dsquare
set-option -g @tokyo-night-tmux_terminal_icon  
set-option -g @tokyo-night-tmux_active_terminal_icon  
set-option -g @tokyo-night-tmux_window_tidy_icons 0
set -g allow-passthrough on
set -g set-clipboard on
# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
